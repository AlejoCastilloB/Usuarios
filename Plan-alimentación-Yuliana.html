const { useState } = React;

function OptionCard({ option, color, colorSoft, index }) {
  const [open, setOpen] = useState(false);
  const [tab, setTab]   = useState("ingredientes");
  return (
    <div style={{background:T.surface,border:`1.5px solid ${open?color+"66":T.border}`,borderRadius:16,overflow:"hidden",marginBottom:10,boxShadow:open?`0 4px 20px ${color}18`:"none",transition:"border-color 0.2s,box-shadow 0.2s"}}>
      <div onClick={()=>setOpen(!open)} style={{padding:"14px 16px",cursor:"pointer",background:open?colorSoft:T.surface,display:"flex",justifyContent:"space-between",alignItems:"center",transition:"background 0.2s"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{width:26,height:26,borderRadius:"50%",background:color,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0}}>{index+1}</span>
          <span style={{fontFamily:"'Playfair Display',Georgia,serif",fontStyle:"italic",fontSize:15,color:T.ink,fontWeight:600}}>{option.name}</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:12,color:T.muted,fontWeight:600}}>{option.kcal} kcal</span>
          <span style={{fontSize:18,color,display:"inline-block",transform:open?"rotate(90deg)":"rotate(0deg)",transition:"transform 0.2s"}}>›</span>
        </div>
      </div>
      {open && (
        <div style={{padding:"0 16px 18px"}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",padding:"14px 0 12px"}}>
            {[{l:"Proteína",v:option.macro.p,c:T.sage},{l:"Carbs",v:option.macro.c,c:T.rose},{l:"Grasas",v:option.macro.g,c:T.sand}].map(m=>(
              <span key={m.l} style={{background:m.c+"22",border:`1px solid ${m.c}44`,borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,color:m.c}}>{m.l} {m.v}g</span>
            ))}
            <span style={{background:T.warm,borderRadius:20,padding:"3px 10px",fontSize:11,color:T.muted,fontWeight:600}}>⏱ {option.prep}</span>
          </div>
          <div style={{display:"flex",borderBottom:`1px solid ${T.border}`,marginBottom:14}}>
            {["ingredientes","preparación"].map(t=>(
              <button key={t} onClick={()=>setTab(t)} style={{background:"none",border:"none",padding:"7px 14px",fontSize:12,fontWeight:700,color:tab===t?color:T.muted,cursor:"pointer",borderBottom:tab===t?`2px solid ${color}`:"2px solid transparent",marginBottom:-1,textTransform:"capitalize",transition:"color 0.15s"}}>{t}</button>
            ))}
          </div>
          {tab==="ingredientes" && (
            <div>{option.ingredients.map((ing,i)=>(
              <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:7}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:color,marginTop:6,flexShrink:0}}/>
                <span style={{fontSize:13,color:"#4A4040",lineHeight:1.55}}>{ing}</span>
              </div>
            ))}</div>
          )}
          {tab==="preparación" && (
            <div>{option.instructions.map((step,i)=>(
              <div key={i} style={{display:"flex",gap:10,marginBottom:10}}>
                <span style={{width:22,height:22,borderRadius:"50%",background:color+"22",color,fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{i+1}</span>
                <span style={{fontSize:13,color:"#4A4040",lineHeight:1.6}}>{step}</span>
              </div>
            ))}</div>
          )}
          <div style={{marginTop:14,background:color+"15",borderLeft:`3px solid ${color}`,borderRadius:"0 8px 8px 0",padding:"8px 12px",fontSize:12,color:T.muted,fontStyle:"italic"}}>💡 {option.tip}</div>
        </div>
      )}
    </div>
  );
}

function MealSection({meal}) {
  return (
    <div style={{marginBottom:36}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
        <span style={{fontSize:24}}>{meal.icon}</span>
        <div>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:22,fontWeight:700,color:T.ink,lineHeight:1}}>{meal.label}</div>
          <div style={{fontSize:12,color:T.muted,marginTop:2}}>{meal.time} · {meal.kcalRange}</div>
        </div>
        <span style={{marginLeft:"auto",background:meal.colorSoft,color:meal.color,border:`1px solid ${meal.color}44`,borderRadius:20,padding:"4px 12px",fontSize:11,fontWeight:700}}>6 opciones</span>
      </div>
      {meal.options.map((opt,i)=><OptionCard key={i} option={opt} color={meal.color} colorSoft={meal.colorSoft} index={i}/>)}
    </div>
  );
}

    {icon:"🍳",title:"Prep mínimo, resultado máximo",body:"Con huevos cocidos, arroz y pollo en nevera, el 80% de las opciones son de 5 minutos o menos."},
    {icon:"🏃‍♀️",title:"Actividad moderada = no compensar",body:"No hace falta comer extra por el ejercicio diario moderado. El plan ya tiene ese gasto calculado."},
    {icon:"🍫",title:"Caprichos sin drama",body:"1–2 veces por semana puede comer algo fuera del plan. Con un déficit tan pequeño, una comida libre no rompe nada."},
    {icon:"💧",title:"Hidratación primero",body:"2–2.5 L de agua al día. Muchas veces lo que parece hambre es sed. El yogur y la fruta ayudan, pero el agua es lo que más influye."},
    {icon:"📆",title:"Cómo armar un día real",body:"Elige 1 opción de desayuno + 1 de almuerzo + 1 de cena + snack si hay hambre. Varía cada día para no aburrirte."},
    {icon:"🧊",title:"Batch mínimo para la semana",body:"Cocer 400 g de arroz, 2–3 filetes de pollo y 6 huevos duros el domingo ahorra 30 min diarios. No hace falta meal prep completo."},
  ];
  return (
    <div style={{minHeight:"100vh",background:T.bg,color:T.ink}}>
      {/* NAVBAR */}
      <div style={{background:T.ink,padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,borderRadius:9,background:T.rose,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Playfair Display',serif",fontWeight:700,color:"#fff",fontSize:16,flexShrink:0}}>AC</div>
          <div>
            <div style={{color:"#fff",fontWeight:800,fontSize:13,lineHeight:1}}>Alejo Castillo</div>
            <div style={{color:T.light,fontSize:10,letterSpacing:"0.07em",textTransform:"uppercase"}}>Coach · @alejocastillob</div>
          </div>
        </div>
        <div style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:20,padding:"5px 12px",display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:26,height:26,borderRadius:"50%",background:T.rose,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,flexShrink:0}}>YE</div>
          <div>
            <div style={{color:"#fff",fontSize:11,fontWeight:700,lineHeight:1.1}}>Yuliana Echeverri</div>
            <div style={{color:T.light,fontSize:9}}>Plan personalizado</div>
          </div>
        </div>
      </div>

      {/* HERO */}
      <div style={{background:T.surface,borderBottom:`1px solid ${T.border}`,padding:"26px 20px 22px"}}>
        <div style={{display:"inline-block",background:T.roseSoft,color:T.rose,borderRadius:20,padding:"3px 14px",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>23 años · 1.68 m · Actividad moderada</div>
        <h1 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:32,fontWeight:700,color:T.ink,margin:"0 0 4px",lineHeight:1.15}}>
          Comer bien,<br/><span style={{color:T.rose,fontStyle:"italic"}}>sin complicarse</span>
        </h1>
        <p style={{color:T.muted,fontSize:13,margin:"8px 0 20px",lineHeight:1.6}}>
          53 kg → <strong style={{color:T.ink}}>52 kg</strong> · Déficit suave y sostenible
        </p>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {[{label:"Calorías",value:"~1.680 kcal",color:T.rose,note:"déficit de 200 kcal/día"},{label:"Proteína",value:"~106 g",color:T.sage,note:"2 g/kg · prioridad #1"},{label:"Carbs",value:"~185 g",color:T.sand,note:"energía diaria"}].map((m,i)=>(
            <div key={i} style={{background:T.warm,borderRadius:12,padding:"10px 14px",flex:1,minWidth:90}}>
              <div style={{fontSize:17,fontWeight:800,color:m.color}}>{m.value}</div>
              <div style={{fontSize:12,fontWeight:700,color:T.ink}}>{m.label}</div>
              <div style={{fontSize:10,color:T.muted}}>{m.note}</div>
            </div>
          ))}
        </div>
      </div>

      {/* TABS */}
      <div style={{padding:"0 20px"}}>
        <div style={{display:"flex",borderBottom:`2px solid ${T.border}`,marginBottom:24,marginTop:18}}>
          {[{id:"plan",label:"🍽️ Opciones por comida"},{id:"notas",label:"📌 Reglas simples"}].map(t=>(
            <button key={t.id} onClick={()=>setMainTab(t.id)} style={{background:"none",border:"none",padding:"10px 16px",fontSize:13,fontWeight:700,color:mainTab===t.id?T.rose:T.muted,cursor:"pointer",borderBottom:mainTab===t.id?`2px solid ${T.rose}`:"2px solid transparent",marginBottom:-2,transition:"color 0.2s"}}>{t.label}</button>
          ))}
        </div>

        {mainTab==="plan" && (
          <div style={{paddingBottom:60}}>
            <div style={{background:T.sageSoft,border:`1px solid ${T.sage}44`,borderRadius:12,padding:"11px 15px",marginBottom:24,fontSize:13,color:T.sage,fontWeight:600}}>
              ↓ Toca una opción para ver ingredientes y preparación paso a paso
            </div>
            {meals.map(meal=><MealSection key={meal.id} meal={meal}/>)}
          </div>
        )}

        {mainTab==="notas" && (
          <div style={{paddingBottom:60}}>
            {notas.map((note,i)=>(
              <div key={i} style={{display:"flex",gap:14,padding:"18px 0",borderBottom:i<notas.length-1?`1px solid ${T.border}`:"none"}}>

                <div>
                  <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontWeight:700,fontSize:15,color:T.ink,marginBottom:4}}>{note.title}</div>

                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{background:T.ink,padding:"18px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:28,height:28,borderRadius:7,background:T.rose,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Playfair Display',serif",fontWeight:700,color:"#fff",fontSize:12}}>AC</div>
          <div>
            <div style={{color:"#fff",fontWeight:700,fontSize:12}}>Alejo Castillo · Coach</div>
            <div style={{color:T.light,fontSize:10}}>@alejocastillob · YouTube · TikTok · Instagram</div>
          </div>
        </div>
        <div style={{color:T.muted,fontSize:10}}>Plan personalizado · Yuliana Echeverri</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
